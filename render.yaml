services:
  - type: web
    name: company-os
    env: node
    region: oregon
    plan: free
    rootDir: company-os/web
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/admin/status
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: SESSION_SECRET
        generateValue: true
      # ── Platform AI — set at least one of these in Render dashboard ──
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD_HASH
        sync: false   # set in Render dashboard: salt:hash
      - key: OPENCODE_API_KEY
        sync: false   # your OpenCode / OpenRouter key
      - key: OPENCODE_BASE_URL
        sync: false   # e.g. https://openrouter.ai/api/v1
      - key: OPENCODE_MODEL
        sync: false   # e.g. anthropic/claude-sonnet-4-5
      - key: ANTHROPIC_API_KEY
        sync: false   # optional: platform Claude key
      - key: OPENAI_API_KEY
        sync: false   # optional: platform GPT key
